site_name: STØ Token Service documentation
site_dir: _site
site_url: https://bankaxept.github.io/bankaxept-ctsp-external-documentation/
repo_url: https://github.com/BankAxept/bankaxept-ctsp-external-documentation
repo_name: BankAxept/bankaxept-ctsp-external-documentation
docs_dir: docs
copyright: Copyright &copy; 2026 Stø
plugins:
  - mermaid2:
      arguments:
        theme: forest
  - search
nav:
  - Welcome: README.md
  - Overview:
      - Integration overview: getting_started.md
      - Tokenization concepts: tokenization.md
      - Choosing an interface: choosing_an_interface.md
      - Environments and endpoints: environments.md
  - Connectivity:
      - Overview and checklist: onboarding.md
      - Mutual TLS: mtls_configuration.md
      - Connectivity test: connectivity_test.md
      - Key exchange: zmk_exchange.md
  - ISO 8583 API:
      - Message reference: TSP_ISO_Message_V2.9.md
      - Message authentication (MAC): macusage.md
      - Worked MAC example: mac_create.md
  - JSON API:
      - API reference: api_reference.md
  - Reference:
      - API design guidelines: api_policy.md

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - https://unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js
  - assets/javascripts/swagger.js
  - assets/javascripts/mermaid-init.js
extra_css:
  - https://unpkg.com/swagger-ui-dist@3/swagger-ui.css
  - assets/stylesheets/custom-swagger.css
  - assets/stylesheets/sto-theme.css
theme:
  name: material
  logo: assets/images/sto-logo.svg
  favicon: assets/images/sto-logo.svg
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.links
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: black
      accent: lime
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: black
      accent: lime

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - meta
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
